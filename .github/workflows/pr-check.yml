name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

      - name: Run checks
        run: |
          if ! bun run ci; then
            echo "❌ Checks failed. Run 'bun run format' and 'bun run ci' locally and commit the changes."
            exit 1
          fi

      - name: Verify bundled data
        run: |
          if [ ! -d "data/wwdc" ]; then
            echo "❌ WWDC data not found"
            exit 1
          fi

          file_count=$(find data/wwdc -name "*.json" | wc -l)
          if [ "$file_count" -lt 1000 ]; then
            echo "❌ Expected at least 1000 JSON files in WWDC data, found $file_count"
            exit 1
          fi

          if [ ! -f "api-map/apple-docs-map.tsv" ]; then
            echo "❌ Docs map api-map/apple-docs-map.tsv not found"
            exit 1
          fi

          echo "✅ Found $file_count WWDC data files and the docs map"

      - name: Check package size
        run: |
          size=$(bun pm pack --dry-run 2>/dev/null | grep -i 'unpacked size' | awk '{print $NF}' || true)
          echo "📦 Package unpacked size: ${size:-unknown}"

      - name: Comment PR status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success = '${{ job.status }}' === 'success';

            const body = success
              ? '✅ **All PR checks passed!**\n\n- ✓ Type checking\n- ✓ Commit messages\n- ✓ Biome and markdownlint\n- ✓ Tests\n- ✓ Bundled data'
              : '❌ **PR checks failed**\n\nPlease review the CI logs for details.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
