name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run ci

      - name: Verify package
        run: |
          # Check package.json version matches tag
          PACKAGE_VERSION=v$(bun -p "require('./package.json').version")
          TAG_NAME=${GITHUB_REF#refs/tags/}

          if [ "$PACKAGE_VERSION" != "$TAG_NAME" ]; then
            echo "❌ Package version ($PACKAGE_VERSION) doesn't match tag ($TAG_NAME)"
            exit 1
          fi

          echo "✅ Version check passed: $PACKAGE_VERSION"

      - name: Publish to npm
        run: bun publish --access public
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          body: |
            ## 🚀 Published to npm

            Run with Bun 1.4.3 or later:
            ```bash
            bunx apple-docs-mcp-next
            ```

            ## 📦 What's included
            - Bundled WWDC session data with transcripts and code
            - The docs map of Apple's documentation pages
            - Runs from TypeScript source on Bun, no build step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
